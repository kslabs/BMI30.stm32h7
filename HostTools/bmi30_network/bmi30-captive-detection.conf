# BMI30 Wi-Fi captive portal discovery (AP address 10.42.0.1).
# Keep ordinary DNS forwarding. Only dedicated OS connectivity-test hosts
# reach the portal's existing probe handlers. No wildcard or HTTPS interception.
# A matching local= rule also prevents upstream AAAA answers bypassing IPv4.

# Apple Captive Network Assistant (iOS/iPadOS/macOS).
address=/captive.apple.com/10.42.0.1
local=/captive.apple.com/

# Windows 10/11 NCSI web probes and browser redirect endpoint.
address=/msftconnecttest.com/10.42.0.1
local=/msftconnecttest.com/
address=/www.msftncsi.com/10.42.0.1
local=/www.msftncsi.com/
address=/ipv6.msftncsi.com/10.42.0.1
local=/ipv6.msftncsi.com/

# Older Windows DNS probe must retain its expected answer even without WAN.
# The separate HTTP probe above then detects the BMI30 captive portal.
host-record=dns.msftncsi.com,131.107.255.255

# Android NetworkStack (including Android 14) and older Android devices.
# Match only dedicated probe hosts. In particular, www.gstatic.com remains
# upstream: BMI30's own HTTPS internet/relay checks use that different host.
address=/connectivitycheck.gstatic.com/10.42.0.1
local=/connectivitycheck.gstatic.com/
address=/connectivitycheck.android.com/10.42.0.1
local=/connectivitycheck.android.com/
address=/clients3.google.com/10.42.0.1
local=/clients3.google.com/
